<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animação keyframe</title>
    <style>
        *{
            box-sizing: border-box;
        }

        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: auto;
            background-color: blueviolet;
            padding: 15px;
            color: aliceblue;
            border-bottom: 5px solid rgb(30, 13, 92);
            border-radius: 15px;
        }

        @keyframes 
        flutuar{
        0%{
            transform: translateY(0px);
        }
       
        50%{
            transform: translateY(19px);
        }
        100%{
            transform: translateY(0px);
        }
    }

        .icone-bau{
            margin: 40px;
            width: 100px;
            height: auto;
            animation: flutuar 3s ease-in-out infinite;
        }
        /*responsabilidade para telas menores que 768*/
        @media (max-width: 768px){
            .navbar{
                flex-direction: column;
                height: auto;
                gap: 10px;
            }



            




        }
        a{
            color: white;
            text-decoration: none;
        }

    </style>
</head>
<body>
    <header class="navbar">
        <h1>gamer Store</h1>
         <nav>
        <a href="">inicio</a>
        <a href="">jogos</a>
        <a href="">contato</a>
    </nav>
    </header>
    <main>
        <div class="card-jogo">
            <img src="https://cdn-icons-png.flaticon.com/512/4883/4883370.png" alt="Baú de Oferta" class="icone-bau">
        </div>
    </main>

   

</body>
</html>
